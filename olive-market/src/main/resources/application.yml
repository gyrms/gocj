spring:
  datasource:
    url: jdbc:mysql://localhost:3306/olive_market?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop   # 개발 중에는 create-drop, 운영 시 validate로 변경
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: olive-market-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000   # 24시간 (ms)
